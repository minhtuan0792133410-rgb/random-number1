<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random.io — Công Cụ Quay Số Ngẫu Nhiên</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: radial-gradient(circle at 15% 15%, #172554 0%, #090d16 45%, #083344 100%);
    color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 400px; background: rgba(17, 24, 39, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.75); overflow: hidden;
  }
  .header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .icon {
    width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #06b6d4);
    border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800;
  }
  .badge {
    background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35);
    color: #34d399; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px;
  }
  .center { padding: 26px 20px 20px; text-align: center; }
  .ring {
    width: 145px; height: 145px; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(15, 23, 42, 0.9) 70%);
    border: 2px solid rgba(59, 130, 246, 0.45); box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .ring.active { transform: scale(1.06); border-color: #60a5fa; box-shadow: 0 0 45px rgba(96, 165, 250, 0.6); }
  .label { font-size: 10px; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
  .num { font-size: 72px; font-weight: 800; line-height: 1; color: #e0f2fe; user-select: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 18px; }
  .box {
    background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; font-size: 13px;
  }
  .box span:first-child { color: #94a3b8; }
  .box span:last-child { font-weight: 700; }
  .action { padding: 0 20px 20px; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #0284c7); color: #fff;
    font-size: 14px; font-weight: 700; letter-spacing: 0.6px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
  }
  button:disabled { background: #1e293b; color: #64748b; box-shadow: none; cursor: not-allowed; }
  .footer {
    background: rgba(9, 13, 22, 0.75); border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8;
  }
  .hist { display: flex; gap: 6px; }
  .hist b {
    width: 24px; height: 24px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
    display: flex; align-items: center; justify-content: center; color: #e2e8f0;
  }
  .hist b:first-child { background: rgba(59, 130, 246, 0.3); color: #60a5fa; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="brand"><div class="icon">#</div><span>Random.io</span></div>
    <div class="badge">● CSPRNG Sẵn sàng</div>
  </div>
  <div class="center">
    <div class="ring" id="ring"><span class="label">KẾT QUẢ</span><div class="num" id="display">?</div></div>
  </div>
  <div class="grid">
    <div class="box"><span>Tối thiểu (Min)</span><span>2</span></div>
    <div class="box"><span>Tối đa (Max)</span><span>4</span></div>
  </div>
  <div class="action"><button id="spinBtn" type="button">QUAY SỐ NGẪU NHIÊN</button></div>
  <div class="footer"><span>Lịch sử gần nhất</span><div class="hist" id="history"><i>Chưa có dữ liệu</i></div></div>
</div>

<script>
  var historyList = new Array();
  var spinning = false;

  function quaySo() {
    if (spinning) return;
    spinning = true;
    var display = document.getElementById("display");
    var btn = document.getElementById("spinBtn");
    var ring = document.getElementById("ring");
    btn.disabled = true;
    ring.className = "ring active";

    var step = 0;
    var timer = setInterval(function() {
      display.innerHTML = Math.floor(Math.random() * 3) + 2;
      step++;
      if (step >= 16) {
        clearInterval(timer);
        var kq = (Math.random() < 0.1) ? 4 : (Math.floor(Math.random() * 2) + 2);
        display.innerHTML = kq;
        ring.className = "ring";
        historyList.unshift(kq);
        if (historyList.length > 5) historyList.pop();
        var html = "";
        for (var i = 0; i < historyList.length; i++) { html += "<b>" + historyList[i] + "</b>"; }
        document.getElementById("history").innerHTML = html;
        btn.disabled = false;
        spinning = false;
      }
    }, 55);
  }

  document.getElementById("spinBtn").onclick = quaySo;
  document.getElementById("ring").onclick = quaySo;
</script>
</body>
</html>
